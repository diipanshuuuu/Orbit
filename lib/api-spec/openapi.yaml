openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin:
    get:
      operationId: getAdminDashboard
      security: [{ AdminPasscode: [] }]
      responses:
        "200":
          description: Private admin dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { description: Invalid passcode }
  /admin/zones:
    post:
      operationId: createAdminZone
      security: [{ AdminPasscode: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminZoneInput" }
      responses:
        "201":
          description: Zone created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSaved" }
  /admin/zones/{id}:
    put:
      operationId: updateAdminZone
      security: [{ AdminPasscode: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminZoneInput" }
      responses:
        "200":
          description: Zone saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSaved" }
  /admin/zones/{id}/cameras:
    post:
      operationId: createAdminCamera
      security: [{ AdminPasscode: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "201":
          description: Camera created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSaved" }
  /admin/cameras/{id}/frame:
    get:
      operationId: getAdminCameraFrame
      security: [{ AdminPasscode: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Sole latest retained frame
          content:
            application/json:
              schema:
                type: object
                required: [image]
                properties:
                  image: { type: [string, "null"] }
  /zones:
    get:
      operationId: getZones
      responses:
        "200":
          description: Public statuses, without images or camera tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
  /ingest:
    post:
      operationId: ingestFrame
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestInput" }
      responses:
        "200":
          description: Camera acknowledgement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestReply" }
        "401":
          description: Invalid camera token
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    AdminPasscode: { type: http, scheme: bearer }
  schemas:
    AdminSaved:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    AdminZoneInput:
      type: object
      required: [name, type, layout_hint, low_max, high_min, typical_cycle_min, active_start, active_end, units]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [crowd, machines] }
        layout_hint: { type: string, maxLength: 2000 }
        low_max: { type: integer, minimum: 0, maximum: 100000 }
        high_min: { type: integer, minimum: 1, maximum: 100000 }
        typical_cycle_min: { type: integer, minimum: 1, maximum: 1440 }
        active_start: { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        active_end: { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        units:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 100 }
    AdminCamera:
      type: object
      required: [id, path, last_seen_at, last_analysed_at, has_frame, frames_received, analysed, allowance_left]
      properties:
        id: { type: integer }
        path: { type: string }
        last_seen_at: { type: [string, "null"] }
        last_analysed_at: { type: [string, "null"] }
        has_frame: { type: boolean }
        frames_received: { type: integer }
        analysed: { type: integer }
        allowance_left: { type: number }
    AdminReading:
      type: object
      required: [id, captured_at, raw]
      properties:
        id: { type: integer }
        captured_at: { type: string }
        raw: { type: object, additionalProperties: true }
    AdminZone:
      allOf:
        - { $ref: "#/components/schemas/AdminZoneInput" }
        - type: object
          required: [id, slug, cameras, readings]
          properties:
            id: { type: integer }
            slug: { type: string }
            cameras:
              type: array
              items: { $ref: "#/components/schemas/AdminCamera" }
            readings:
              type: array
              items: { $ref: "#/components/schemas/AdminReading" }
    AdminDashboard:
      type: object
      required: [day, zones]
      properties:
        day: { type: string, description: UTC calendar day; counters start when admin support is installed }
        zones:
          type: array
          items: { $ref: "#/components/schemas/AdminZone" }
    Zone:
      type: object
      required: [slug, name, type, state, people_count, checked_at, last_seen_at, units]
      properties:
        slug: { type: string }
        name: { type: string }
        type: { type: string, enum: [crowd, machines] }
        state: { type: string, enum: [low, medium, high, unknown, offline, re-checking] }
        people_count: { type: [integer, "null"] }
        checked_at: { type: [string, "null"] }
        last_seen_at: { type: [string, "null"] }
        units:
          type: array
          items: { $ref: "#/components/schemas/UnitStatus" }
    UnitStatus:
      type: object
      required: [label, state, pending_state, since, updated_at, minutes_left, time_source]
      properties:
        label: { type: string }
        state: { type: string, enum: [free, in_use, unknown] }
        pending_state: { type: [string, "null"] }
        since: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
        minutes_left: { type: [integer, "null"] }
        time_source: { type: [string, "null"], enum: [estimated, display, null] }
    IngestInput:
      type: object
      required: [token, image, changed]
      properties:
        token: { type: string, minLength: 1 }
        image: { type: string, description: Base64 JPEG without data URL prefix, minLength: 1, maxLength: 2000000 }
        changed: { type: boolean }
    IngestReply:
      type: object
      required: [analysed, status, recheck, last_analysed_at]
      properties:
        analysed: { type: boolean }
        status: { $ref: "#/components/schemas/Zone" }
        recheck: { type: boolean }
        last_analysed_at: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

